; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = arduino_nano_esp32

[deps]
json = bblanchon/ArduinoJson
arx = hideakitai/ArxContainer@^0.7.0

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
lib_deps =
	${deps.json}
	arduino-libraries/NTPClient
	knolleary/PubSubClient
	roboticsbrno/ServoESP32
	${deps.arx}
board_build.filesystem = spiffs
monitor_speed = 9600
build_flags = -D MQTT_MAX_PACKET_SIZE=2048 -DCORE_DEBUG_LEVEL=5 -std=gnu++17
build_unflags = -std=gnu++11
board_build.partitions = partitions.csv
board_build.mcu = esp32s3
upload_protocol = esptool ;uncomment for FS Upload
;debug_tool = esp-builtin
test_ignore = *

[env:arduino_nano_esp32_ota]
extends = env:arduino_nano_esp32
upload_protocol = custom
upload_command = curl -f -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/update

[env:nano_esp32_test]
extends = env:arduino_nano_esp32
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
test_filter = embedded/*
test_ignore = native/*

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
lib_extra_dirs = test/mocks
lib_compat_mode = off
lib_deps =
	${deps.json}
	${deps.arx}
	OCFNativeMocks
build_flags = -std=gnu++17 -Isrc -DARDUINO=10819 -DARDUINOJSON_ENABLE_PROGMEM=0 -D MQTT_MAX_PACKET_SIZE=2048 -Wall -Werror=format -Wno-deprecated-declarations
test_filter = native/*
