name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio pkg update -e native
      - run: pio test -e native

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio pkg update -e arduino_nano_esp32
      - run: pio run -e arduino_nano_esp32
      - run: pio test -e nano_esp32_test --without-uploading --without-testing
